[project]
name = "yellow-agent"
version = "0.1.0"
description = "An AI agent that plays Pokémon Yellow through an emulator — a hands-on study of applied AI engineering (LLMs, RAG, MCP, agents, evals, fine-tuning)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyboy>=2.5",
    "mcp>=2.0",
    "pydantic>=2.6",
    "pillow>=10",  # PyBoy needs it for screen.image (screenshot tool)
]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.50"]   # also used for Ollama (OpenAI-compatible endpoint)
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
yellow-mcp = "yellow_agent.mcp_server:main"
yellow-fetch-data = "yellow_agent.tools.fetch_pret_data:main"
yellow-snapshot = "yellow_agent.snapshot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yellow_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["rom: needs a real Pokémon Yellow ROM (set YELLOW_ROM)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
